[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]

[tool.ruff]
line-length = 100
# Local dev runs on 3.9 (macOS system Python); Render on 3.12. Target the lower
# so lint never suggests syntax that breaks the dev machine.
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]     # env must be set before app imports
"app/main.py" = ["E402"] # load_dotenv() must run before app modules read env
